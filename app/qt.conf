# Read by every Qt program in this directory, before it loads anything.
#
# Prefix is relative to the directory holding the executable, so bin/../lib/
# cutreel is where Qt looks -- which is true of an unpacked tarball in a home
# directory and of /usr/bin after a .deb, without either of them being told
# where they are. Plugins is relative to Prefix in turn.
#
# Linux only: macOS and Windows have deployment tools that write their own.
[Paths]
Prefix = ../lib/cutreel
Plugins = plugins
