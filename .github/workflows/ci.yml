name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04]
        preset: [debug, release, asan]
        exclude:
          # One sanitizer run is enough signal; it is the slowest job by far.
          - os: ubuntu-24.04
            preset: asan

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      # Pinned exactly: clang-format's output changes between major versions,
      # and a CI job that disagrees with everyone's editor gets ignored.
      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      - name: Check formatting
        run: |
          for dir in core ui-core platform app; do
            [ -d "$dir" ] || continue
            find "$dir" \( -name '*.cpp' -o -name '*.h' \) -print0 \
              | xargs -0 --no-run-if-empty clang-format --dry-run --Werror
          done
