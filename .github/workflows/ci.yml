name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

# Superseded pull-request runs are worth cancelling; superseded branch runs are
# not. A push to main or dev is a commit that will exist forever and whose CI
# result someone will want to look up later, and the Windows jobs take long
# enough that a run of pushes would cancel each one in turn and never produce a
# result for any of them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # One place to change the Qt version. Windows takes it from the official
  # binaries; macOS and Linux take whatever Homebrew and the distribution ship,
  # which is the same thing developers on those platforms have.
  QT_VERSION: 6.9.3

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Generous enough for a cold Windows dependency build, short enough that a
    # deadlocked test is reported the same day.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than a product, because the three platforms do not
        # want the same presets: sanitizers are a Clang/GCC feature, and Windows
        # pays a much larger setup cost per job than it is worth spending three
        # times over.
        #
        # `artifact` names the archive a row uploads, and only the three
        # release rows carry one: a debug or sanitizer build is not something
        # to hand anybody, and the three that are cover the three platforms.
        include:
          - { name: macos / debug,     os: macos-14,      preset: debug }
          - { name: macos / release,   os: macos-14,      preset: release,         artifact: macos }
          - { name: macos / asan,      os: macos-14,      preset: asan }
          - { name: linux / debug,     os: ubuntu-24.04,  preset: debug }
          - { name: linux / release,   os: ubuntu-24.04,  preset: release,         artifact: linux }
          - { name: windows / debug,   os: windows-2022,  preset: windows-debug }
          - { name: windows / release, os: windows-2022,  preset: windows-release, artifact: windows }

    steps:
      - uses: actions/checkout@v6

      # Ninja comes with every runner image this workflow uses -- 1.13.2 on
      # ubuntu-24.04, macos-14 and windows-2022 alike -- so it is taken from
      # there rather than installed. The action that used to do it,
      # gha-setup-ninja, is one of the node20 actions GitHub now warns about,
      # and it was fetching a tool already on the machine.
      #
      # Checked rather than assumed: if an image ever stops shipping it, this
      # says so here instead of at Configure, where the failure is about
      # CMAKE_MAKE_PROGRAM and never mentions Ninja.
      - name: Check for Ninja
        shell: bash
        run: ninja --version

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg sdl2 qt pkg-config nlohmann-json

      # Qt is deliberately absent from this list -- see the Qt step below.
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ffmpeg nlohmann-json3-dev libsdl2-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libvulkan-dev mesa-vulkan-drivers

      # Windows has no system package manager for the libraries we link, so they
      # come from the vcpkg manifest instead.
      # What ilammy/msvc-dev-cmd@v1 was doing, done directly. That action is
      # the last node20 one in this workflow and has no newer major to move
      # to -- its master branch still says `using: node20` -- and all it does
      # is run vcvars64.bat and hand the resulting environment to the steps
      # that follow. GITHUB_ENV does that part for us.
      #
      # Only the variables vcvars actually changes are exported, rather than
      # the whole environment: GITHUB_ENV is parsed line by line, and cmd's
      # `set` prints entries that are not name=value pairs at all.
      - name: Set up MSVC
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw "vswhere.exe not found at $vswhere" }
          $install = & $vswhere -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $install) { throw "No Visual Studio with the C++ toolset is installed" }
          $vcvars = Join-Path $install "VC\Auxiliary\Build\vcvars64.bat"
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat not found at $vcvars" }
          Write-Host "Using $vcvars"

          $before = @{}
          Get-ChildItem env: | ForEach-Object { $before[$_.Name] = $_.Value }

          $exported = 0
          # `call`, so that control returns and `set` actually runs; stderr is
          # left alone so that a vcvars failure says why rather than vanishing.
          foreach ($line in (cmd /c "call `"$vcvars`" >nul && set")) {
            $pair = $line -split '=', 2
            if ($pair.Count -ne 2) { continue }
            $name = $pair[0]
            $value = $pair[1]
            # A name is never empty and never starts with '='; a value that
            # spans lines cannot be written to GITHUB_ENV in this form.
            if (-not $name -or $name.StartsWith('=') -or $value -match "`n") { continue }
            if ($before[$name] -ne $value) {
              Add-Content -Path $env:GITHUB_ENV -Value "$name=$value"
              $exported++
            }
          }
          Write-Host "Exported $exported variables from vcvars64.bat"
          if ($exported -eq 0) { throw "vcvars64.bat changed nothing; the toolchain is not set up" }

      # The environment above only reaches the *next* step, so this is both the
      # check that it worked and the first place it could be checked. Without
      # it a failure here would surface as CMake not finding a compiler.
      - name: Check the MSVC toolchain
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          where cl.exe
          where link.exe

      # Qt comes from the official binaries on both Windows and Linux, and only
      # from Homebrew on macOS.
      #
      # Windows has no system Qt at all. Linux has one, but Ubuntu 24.04 is on
      # Qt 6.4, and private modules did not get their own CMake package until
      # 6.9 -- so the GuiPrivate component platform/qrhi asks for cannot be
      # satisfied from apt at any number of -dev packages. Pinning the version
      # here also means the two platforms build against one known Qt rather
      # than whatever the runner image happens to carry this month.
      #
      # 6.9.3 is the newest the online installer serves; keep this in step with
      # the floor in platform/qrhi/CMakeLists.txt.
      #
      # platform_qrhi wants GuiPrivate and the shader compiler; the private
      # headers come with qtbase, qsb does not.
      - name: Install Qt
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: qtshadertools
          cache: true

      # Restore and save are split deliberately. actions/cache writes its entry
      # from a post-step, and post-steps do not run when a job is cancelled --
      # so a single cache action throws away a completed FFmpeg build every time
      # a run is superseded, and the next run starts from source again. Saving
      # in a step of its own, on failure as well as success, makes the
      # dependency build survive whatever our own build then does.
      - name: Restore vcpkg packages
        id: vcpkg-cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v6
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      # Built as its own step rather than as a side effect of configuring, so
      # that the log says plainly how much of the job is other people's code.
      - name: Build vcpkg dependencies
        if: runner.os == 'Windows'
        run: >-
          vcpkg install --triplet x64-windows
          --x-install-root=${{ github.workspace }}/vcpkg_installed

      - name: Save vcpkg packages
        if: always() && runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}

      - name: Install FFmpeg CLI (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y

      # Fixtures are generated rather than committed. Without them the media
      # tests skip rather than fail, so a generator failure would hide silently
      # -- hence the explicit check that they actually appeared.
      - name: Generate media fixtures
        shell: bash
        run: |
          ./testdata/generate.sh
          test -f testdata/media/ladder_prores.mov

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      # Packaged before the tests run, not after, so that a run whose tests
      # fail still leaves something to download and try -- which is exactly
      # when somebody wants to look at a build by hand. cpack installs the
      # runtime component only, so no test binary reaches the archive.
      #
      # The same three archives the Release workflow attaches to a draft
      # release; this makes them available from every run rather than only
      # from a tag. Their known limitation is the one recorded in
      # cmake/Packaging.cmake: zaro-preview carries its Qt, and the
      # command-line tools in bin/ expect the libraries they were built
      # against to be on the machine.
      - name: Package
        if: matrix.artifact != ''
        run: cpack --preset ${{ matrix.preset }}

      - name: Collect the archive
        if: matrix.artifact != ''
        shell: bash
        run: |
          mkdir -p dist
          # CPack drops the archive in the build tree next to everything else.
          find "build/${{ matrix.preset }}" -maxdepth 1 \
            \( -name 'CutReel-*.tar.gz' -o -name 'CutReel-*.zip' \) -exec cp {} dist/ \;
          ls -l dist
          # An empty upload is a green job that shipped nothing, which is worse
          # than a red one.
          test -n "$(ls -A dist)"

      - name: Upload the archive
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v6
        with:
          name: cutreel-${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error
          # Shorter than the 90-day default: these are every-push builds, and
          # the ones worth keeping are on the Releases page instead.
          retention-days: 14

      # The GUI suite is excluded here and run once, on its own, in the job
      # below. It needs a display and a working QRhi, which is a property of the
      # runner rather than of the build, so running it seven times over would be
      # seven chances to fail for a reason that is not ours.
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -E zaro_app_tests

      # The two exit-criterion harnesses below are POSIX shell scripts that look
      # for extensionless binaries, so they run on macOS and Linux only. Windows
      # gets the compile-and-unit-test signal; the pixel-exactness claim is not
      # platform-specific enough to be worth porting them for.
      - name: Verify frame exactness against FFmpeg
        if: runner.os != 'Windows'
        run: ZARO_FRAME=build/${{ matrix.preset }}/bin/zaro-frame ./scripts/verify-frame-exact.sh

      - name: Verify audio/video sync in a rendered file
        if: runner.os != 'Windows'
        run: |
          ZARO_CUT=build/${{ matrix.preset }}/bin/zaro-cut \
          ZARO_RENDER=build/${{ matrix.preset }}/bin/zaro-render \
          ./scripts/verify-av-sync.sh

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # Pinned exactly: clang-format's output changes between major versions,
      # and a CI job that disagrees with everyone's editor gets ignored.
      - name: Install clang-format
        run: pipx install clang-format==22.1.8

      # Every directory is checked before the job gives up. Letting the first
      # failure abort the loop -- which is what the step's own `bash -e` does
      # unless the status is caught -- means a report that stops at whichever
      # directory happened to sort first, and a second push to discover the
      # rest.
      - name: Check formatting
        run: |
          status=0
          for dir in core ui-core platform app tools; do
            [ -d "$dir" ] || continue
            find "$dir" \( -name '*.cpp' -o -name '*.h' \) -print0 \
              | xargs -0 --no-run-if-empty clang-format --dry-run --Werror || status=1
          done
          exit $status

  gui:
    name: GUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      # From the runner image, as in the build-and-test job above.
      - name: Check for Ninja
        shell: bash
        run: ninja --version

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ffmpeg nlohmann-json3-dev libsdl2-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libvulkan-dev \
            xvfb libgl1-mesa-dri mesa-vulkan-drivers

      # The same Qt the build matrix uses; see the note there for why it is not
      # the distribution's.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: linux_gcc_64
          modules: qtshadertools
          cache: true

      - name: Generate media fixtures
        run: |
          ./testdata/generate.sh
          test -f testdata/media/sync_click_flash.mov

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --target zaro_app_tests

      # A real display, not QT_QPA_PLATFORM=offscreen: that plugin has no QRhi,
      # so a QRhiWidget on it never draws and every test that measures a picture
      # fails. Xvfb with llvmpipe behind it gives a GL the compositor can use.
      #
      # These drive one window through sixty-two gestures and grab the frame
      # each one produced, so they are slower than the headless suites and are
      # kept to a single job rather than a matrix.
      - name: Test
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          QSG_RHI_BACKEND: opengl
        run: xvfb-run -a --server-args="-screen 0 1600x1200x24" ctest --preset debug -R zaro_app_tests --output-on-failure
