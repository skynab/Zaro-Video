name: Release

# Tag a commit to cut a release:
#
#   git tag v0.7.0 && git push origin v0.7.0
#
# The three platform archives are built, attached to a *draft* GitHub release,
# and left there. Publishing is a person's decision, not a workflow's -- a tag
# push is easy to do by accident and impossible to unsend once it has mailed
# every watcher of the repository.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build and draft a release for
        required: true

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos,   os: macos-14,     preset: release }
          - { name: linux,   os: ubuntu-24.04, preset: release }
          - { name: windows, os: windows-2022, preset: windows-release }

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg sdl2 qt pkg-config nlohmann-json

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config ffmpeg nlohmann-json3-dev libsdl2-dev \
            libavcodec-dev libavformat-dev libavutil-dev \
            libswscale-dev libswresample-dev \
            libgl1-mesa-dev libglu1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows and Linux both take Qt from the official binaries; the CI
      # workflow explains why Linux cannot use the distribution's.
      - name: Install Qt
        if: runner.os != 'macOS'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: qtshadertools
          cache: true

      - name: Cache vcpkg packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}-${{ env.VCPKG_INSTALLATION_ROOT }}
          restore-keys: vcpkg-${{ runner.os }}-

      # No tests in a release build: the tag being built has already been
      # through CI, and Catch2 is not something to ship or to wait for here.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -DZARO_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Package
        run: cpack --preset ${{ matrix.preset }}

      - name: Collect the archive
        shell: bash
        run: |
          mkdir -p dist
          # CPack drops the archive in the build tree next to everything else.
          find "build/${{ matrix.preset }}" -maxdepth 1 \
            \( -name 'CutReel-*.tar.gz' -o -name 'CutReel-*.zip' \) -exec cp {} dist/ \;
          ls -l dist
          # An empty upload is a green job that shipped nothing, which is worse
          # than a red one.
          test -n "$(ls -A dist)"

      - uses: actions/upload-artifact@v4
        with:
          name: cutreel-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  draft-release:
    name: Draft the release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --draft \
              --title "CutReel $TAG" \
              --generate-notes
          fi
          echo "Draft release $TAG is ready; publish it from the Releases page."
